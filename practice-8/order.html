<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка — ShopProject</title>
  <meta name="description" content="Оформление заявки в ShopProject: выбор товара, контактные данные и тема обращения.">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body class="page" id="top">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товары</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html" aria-current="page">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#advantages">Преимущества</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#popular">Популярные товары</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#contacts">Обратная связь</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page__main">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current" aria-current="page">Заявка</span>
    </nav>
    <h1 class="page__title">Оформление заявки</h1>

    <form class="order-form order-form--page" id="order-form" action="#" method="post" novalidate>
      <div class="order-form__field">
        <label class="order-form__label" for="selected-product">Товар</label>
        <select class="order-form__select" id="selected-product" name="selected-product" required>
          <option value="">Выберите товар</option>
          <option value="Кроссовки Urban">Кроссовки Urban</option>
          <option value="Рюкзак City">Рюкзак City</option>
          <option value="Наушники Wave">Наушники Wave</option>
        </select>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-name">Имя</label>
        <input class="order-form__input" id="order-name" name="name" type="text" placeholder="Введите ваше имя" minlength="2" autocomplete="given-name" required>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-email">E-mail</label>
        <input class="order-form__input" id="order-email" name="email" type="email" placeholder="example@mail.ru" autocomplete="email" required>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-phone">Телефон</label>
        <input class="order-form__input" id="order-phone" name="phone" type="tel" inputmode="tel" placeholder="+7 (900) 000-00-00" pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$" autocomplete="tel" aria-describedby="phone-hint" required>
        <small class="order-form__hint" id="phone-hint">Формат: +7 (900) 000-00-00</small>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-date">Дата связи</label>
        <input class="order-form__input" id="order-date" name="date" type="date">
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-topic">Тема заявки</label>
        <select class="order-form__select" id="order-topic" name="topic" required>
          <option value="">Выберите тему</option>
          <option value="product">Заказ товара</option>
          <option value="consultation">Консультация</option>
          <option value="delivery">Доставка</option>
        </select>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-comment">Комментарий</label>
        <textarea class="order-form__textarea" id="order-comment" name="comment" rows="4" placeholder="Укажите дополнительную информацию"></textarea>
      </div>
      <div class="order-form__field order-form__field--checkbox">
        <input class="order-form__checkbox" id="order-agreement" name="agreement" type="checkbox" required>
        <label class="order-form__label order-form__label--checkbox" for="order-agreement">Я согласен на обработку данных</label>
      </div>
      <div class="order-form__actions">
        <a class="button button--secondary" href="catalog.html">Вернуться в каталог</a>
        <button class="button button--primary" type="submit">Отправить заявку</button>
      </div>
    </form>
    <p class="success-message" id="success-message" role="status" hidden>Форма заполнена без ошибок!</p>
  </main>

  <footer class="site-footer" id="contacts">
    <p class="site-footer__text">&copy; 2026 ShopProject</p>
    <p class="site-footer__text"><a class="site-footer__link" href="order.html">Оставить заявку</a></p>
  </footer>
  <a class="back-to-top" href="#top">Наверх</a>
</body>
</html>
